services:
  grafana:
    image: grafana/otel-lgtm:latest
    container_name: grafana
    ports:
      - "3000:3000"   # Grafana UI
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/dashboards/dashboard.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/otel-practice.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/dashboards:ro
    networks:
      - otel-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config", "/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # Health check
    depends_on:
      - grafana
    networks:
      - otel-network

  db:
    image: mariadb:latest
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mariadb-data:/var/lib/mysql
    networks:
      - otel-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      DB_DSN: "appuser:apppassword@tcp(db:3306)/app?parseTime=true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - otel-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - otel-network

  # Phase 9: OBI (eBPF 自動計装)。`docker compose --profile obi up` でのみ起動する
  obi:
    image: otel/ebpf-instrument:v0.13.0
    container_name: obi
    profiles: ["obi"]
    command: ["--config=/config/config.yaml"]
    # eBPF でホスト上の他コンテナのプロセスを観測するために必須
    pid: host
    privileged: true
    environment:
      # false にすると SDK 計装済みの backend も OBI の計装対象になる（比較演習用）
      OBI_EXCLUDE_OTEL_INSTRUMENTED: ${OBI_EXCLUDE_OTEL_INSTRUMENTED:-true}
    volumes:
      - ./obi/config.yaml:/config/config.yaml:ro
    depends_on:
      - otel-collector
      - frontend
      - backend
    networks:
      - otel-network

volumes:
  grafana-data:
  mariadb-data:

networks:
  otel-network:
    driver: bridge
